<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Ray-Ban</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="header-content">
            <h1>🕶️ Catálogo Ray-Ban</h1>
            <p>Descubre nuestra colección de gafas de sol</p>
        </div>
    </header>

    <main>
        <section class="filters">
            <button class="filter-btn active" data-filter="all">Todos</button>
            <button class="filter-btn" data-filter="aviador">Aviador</button>
            <button class="filter-btn" data-filter="wayfarer">Wayfarer</button>
            <button class="filter-btn" data-filter="clubmaster">Clubmaster</button>
            <button class="filter-btn" data-filter="otro">Otros</button>
        </section>

        <section class="catalog">
            <div class="glasses-grid" id="glassesGrid">
                <!-- Los productos se cargarán aquí con JavaScript -->
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Catálogo Ray-Ban. Todos los derechos reservados.</p>
    </footer>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
